[test-groups]
# Keep process-heavy integration tests from exhausting host process capacity.
# Measured 2026-09-19 at 0569e4b7315aa128d39725682016fa968faa443e:
# aarch64-apple-darwin median wall time was 77.324s at cap 2 and 49.861s at cap 4;
# x86_64-unknown-linux-gnu was 144.579s at cap 2 and 145.593s at cap 4.
# Cap 8 was rejected after higher-cap-only failures on macOS.
external-process = { max-threads = 4 }

[profile.default]
# Report ordinary tests as slow after 30 seconds and terminate them after 60.
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
# Pi and Codex adapter unit tests also launch process trees; share the
# process-capacity limit without widening their cancellation deadlines or the
# default slow-test backstop. Uncapped, the Codex fixtures miss their 10-second
# watchdogs on macOS once the rest of the suite overlaps them.
filter = "package(um-execution) & (test(workflow::pi::adapter_tests) | test(workflow::codex::adapter_tests))"
test-group = "external-process"

[[profile.default.overrides]]
# Integration tests orchestrate external processes and receive a 120-second backstop.
filter = "kind(test)"
test-group = "external-process"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.timing]
# Same policy as the default profile, plus a JUnit report under the Cargo target
# directory so per-test durations can be ranked; used for timing baselines only.

[profile.timing.junit]
path = "junit.xml"
