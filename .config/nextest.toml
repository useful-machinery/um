[test-groups]
# Keep process-heavy integration tests from exhausting host process capacity.
# Measured 2026-09-19 at 0569e4b7315aa128d39725682016fa968faa443e:
# aarch64-apple-darwin median wall time was 77.324s at cap 2 and 49.861s at cap 4;
# x86_64-unknown-linux-gnu was 144.579s at cap 2 and 145.593s at cap 4.
# Cap 8 was rejected after higher-cap-only failures on macOS.
external-process = { max-threads = 4 }

[profile.default]
# Report ordinary tests as slow after 30 seconds and terminate them after 60.
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
# Pi adapter unit tests also launch process trees; share the process-capacity limit
# without widening their cancellation deadlines or the default slow-test backstop.
filter = "package(um-execution) & test(workflow::pi::adapter_tests)"
test-group = "external-process"

[[profile.default.overrides]]
# The maximum-size Artifact Set fixture syncs 4097 individual files. Reserve the
# whole test pool while it runs so concurrent disk-heavy tests cannot starve its
# existing 60-second backstop; keep the real assembly and validation assertions.
filter = "package(um-cli) & test(maximum_set_assembles_across_forty_one_capability_batches)"
threads-required = "num-test-threads"

[[profile.default.overrides]]
# Integration tests orchestrate external processes and receive a 120-second backstop.
filter = "kind(test)"
test-group = "external-process"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.timing]
# Same policy as the default profile, plus a JUnit report under the Cargo target
# directory so per-test durations can be ranked; used for timing baselines only.

[profile.timing.junit]
path = "junit.xml"
