schemaVersion: 1
agentProfiles:
  coding:
    harness:
      kind: pi
      config:
        model: openai/gpt-5
        thinking: high
steps:
  a:
    kind: cmd
    command:
      argv: ["true"]
    outputs:
      result: { kind: text, from: path, path: a.txt }
  b:
    kind: cmd
    command:
      argv: ["true"]
    outputs:
      result: { kind: text, from: path, path: b.txt }
finalizers:
  report:
    kind: agent
    agent:
      profile: coding
      systemPrompt: prompts/system.md
      message:
        text:
          - firstOf: [outputs.a.result, outputs.b.result]
