schemaVersion: 1
inputs:
  note:
    kind: text
steps:
  a:
    kind: cmd
    command:
      argv: ["true"]
    outputs:
      result: { kind: text, from: path, path: a.txt }
  b:
    kind: cmd
    command:
      argv: ["true"]
    outputs:
      result: { kind: text, from: path, path: b.txt }
  join:
    kind: cmd
    inputs:
      result:
        firstOf: [outputs.a.result, inputs.note]
    command:
      argv: ["true"]
