# A definition rule names a literal definition where a binding reference is expected
# (REQ-WFDEF-39, REQ-WFFORMAT-82).
schemaVersion: 1
inputs:
  ticket:
    kind: text
steps:
  prepare:
    kind: cmd
    command:
      argv: ["true"]
bindings:
  verify: {kind: definition}
triggers:
  repair:
    on: {definition: verify, outcome: broken}
    inputs:
      ticket: event.exports.repairRequest
