schemaVersion: 1
steps:
  a:
    kind: cmd
    command:
      argv: ["true"]
    outputs:
      result: { kind: text, from: path, path: a.txt }
  b:
    kind: cmd
    command:
      argv: ["true"]
    outputs:
      result: { kind: text, from: path, path: b.txt }
finalizers:
  report:
    kind: cmd
    inputs:
      result:
        firstOf: [outputs.a.result, outputs.b.result]
    command:
      argv: ["true"]
