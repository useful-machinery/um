schemaVersion: 1
steps:
  design:
    kind: workflow
    workflow: design.yaml
    on:
      planned: build
      failed: exit.failed
  build:
    kind: workflow
    workflow: build.yaml
    inputs:
      parts:
        firstOf: [outputs.design.parts, outputs.design.plan]
    on:
      built: exit.succeeded
      failed: exit.failed
