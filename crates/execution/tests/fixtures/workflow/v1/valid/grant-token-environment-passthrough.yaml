schemaVersion: 1
environmentPassthrough: [GH_TOKEN, UM_LINEAR_ACCESS_TOKEN, UM_LINEAR_ACCESS_TOKEN_FILE]
steps:
  publish:
    kind: cmd
    environmentPassthrough: [GH_TOKEN]
