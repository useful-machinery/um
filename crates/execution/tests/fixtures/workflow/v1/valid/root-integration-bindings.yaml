# The Sketches engineering root workflow with its Linear and GitHub bindings declared under
# the integration each belongs to and referenced as `$<id>.<name>`, and its triggers on the
# integration itself (REQ-WFDEF-34, REQ-WFFORMAT-82).
schemaVersion: 1
name: engineering
version: "1.0.0"
subject: ticket                     # the input whose value is a run's subject (REQ-WFFORMAT-100)
programs: [scripts]                 # first on PATH for cmd steps and handlers; argv names programs bare
exclude: [tests/, "**/__pycache__/"] # in the tree, outside the digest and the pinned copy

requires:
  tools: [git, gh, python3]           # host-provided, probed at admission; harnesses stay probed per step as today
  integrations:                       # each binding belongs to the provider it names an object of
    linear:
      bindings:
        team:       {kind: team}
        ownedState: {kind: state, default: "Engineering"}   # the one state this lifecycle owns tickets in
        backlog:    {kind: state, default: "Backlog"}
        canceled:   {kind: state, default: "Canceled"}
        done:       {kind: state, default: "Done"}
    github:
      bindings:
        repository: {kind: repository}

triggers:                           # intent; a revision binds it; a source is an integration or a binding
  start:                              # starts this workflow
    on:      {source: linear, event: issue.state_entered,
              where: "event.team == $linear.team and event.state == $linear.ownedState"}
    subject: event.issue.identifier   # one live run per subject per definition; otherwise skipped: subject_busy
    inputs:
      ticket:     event.issue.identifier
      baseBranch: "main"
  release:                            # leaving the owned state, for any destination, ends ownership
    on:      {source: linear, event: issue.state_left,
              where: "event.team == $linear.team and event.state == $linear.ownedState"}
    control:                          # acts on the live run instead of starting one
      run:    bySubject
      action: {when: "event.to == $linear.canceled", then: cancel, else: withdraw}

mirror:                             # what Linear sees of a run; every state is a state binding under linear
  linear:
    issue: inputs.ticket
    onStart:   {comment: "Engineering started by {{operator}}. Run: {{run.url}}"}
    onStage:   {comment: "{{stage}}: {{summary}}"}
    onWait:    {comment: "Waiting for {{wait.kind}}: {{wait.summary}}"}
    onOutcome:
      landed:    {state: $linear.done}
      withdrawn: {state: $linear.backlog, unless: issue.state != $linear.ownedState}
      canceled:  {state: $linear.canceled, unless: issue.state != $linear.ownedState}
      # no superseded: a superseded run is never mirrored, so the ticket stays for its successor

inputs:
  ticket:
    kind: text
  baseBranch:
    kind: text
    default: main
  policy:
    kind: json
    default: policy/engineering.json
  branch:
    kind: text
    optional: true
  answers:
    kind: json
    optional: true
steps:
  prepare:
    kind: cmd
    command:
      argv: ["sh", "-c", "printf landed > verdict.txt"]
    outputs:
      verdict:
        kind: text
        from: path
        path: verdict.txt
outcomes: [landed, failed]          # the outcomes the mirror maps besides the engine's (REQ-WFFORMAT-87)
outcome:
  from: outputs.prepare.verdict
  onFailure: failed
