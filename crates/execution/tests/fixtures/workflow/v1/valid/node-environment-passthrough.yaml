schemaVersion: 1
environmentPassthrough: [TRACKER_TOKEN, WORKFLOW_VISIBLE]
agentProfiles:
  repair:
    harness:
      kind: pi
      config:
        model: openai/gpt-5
        thinking: high
steps:
  file:
    kind: cmd
    environmentPassthrough: [TRACKER_TOKEN]
    recovery:
      retries: 1
      handler:
        kind: cmd
        environmentPassthrough: []
        command:
          argv: ["./repair"]
    command:
      argv: ["./file-issue"]
  inspect:
    kind: agent
    environmentPassthrough: []
    recovery:
      retries: 1
      handler:
        kind: agent
        profile: repair
        prompt: prompts/recovery.md
        environmentPassthrough: [WORKFLOW_VISIBLE]
    agent:
      profile: repair
      systemPrompt: prompts/system.md
      message:
        text:
          - file: prompts/message.md
  legacy:
    kind: cmd
    command:
      argv: ["./legacy"]
finalizers:
  report:
    kind: cmd
    environmentPassthrough: [WORKFLOW_VISIBLE]
    command:
      argv: ["./report"]
