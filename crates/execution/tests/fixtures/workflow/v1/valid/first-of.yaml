schemaVersion: 1
inputs:
  branch:
    kind: text
agentProfiles:
  coding:
    harness:
      kind: pi
      config:
        model: openai/gpt-5
        thinking: high
steps:
  a:
    kind: cmd
    condition:
      equals: [{ ref: inputs.branch }, { value: a }]
    command:
      argv: ["true"]
    outputs:
      result:
        kind: text
        from: path
        path: artifacts/a.txt
      report:
        kind: file
        from: path
        path: artifacts/a.pdf
        mediaType: application/pdf
  b:
    kind: cmd
    condition:
      equals: [{ ref: inputs.branch }, { value: b }]
    command:
      argv: ["true"]
    outputs:
      result:
        kind: text
        from: path
        path: artifacts/b.txt
      report:
        kind: file
        from: path
        path: artifacts/b.pdf
        mediaType: application/pdf
  join:
    kind: cmd
    inputs:
      result:
        firstOf: [outputs.a.result, outputs.b.result]
    command:
      argv: ["true"]
  review:
    kind: agent
    agent:
      profile: coding
      systemPrompt: prompts/system.md
      message:
        text:
          - file: prompts/message.md
          - firstOf: [outputs.a.result, outputs.b.result]
        attachments:
          - firstOf: [outputs.b.report, outputs.a.report]
exports:
  result:
    firstOf: [outputs.a.result, outputs.b.result]
  report:
    firstOf: [outputs.b.report, outputs.a.report]
    presentation:
      title: { value: Report }
