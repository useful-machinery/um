[package]
name = "um-cli"
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.97"
description = "Command-line interface and runner for Useful Machinery"
license = "Apache-2.0"
repository = "https://github.com/useful-machinery/um"
publish = false

[[bin]]
name = "um"
path = "src/main.rs"

[workspace]
members = [
  ".",
  "crates/api",
  "crates/execution",
  "crates/human-auth",
  "crates/runner",
  "crates/runner-protocol",
  "crates/support",
  "crates/test-support",
]
resolver = "3"
exclude = ["vendor/rustls-platform-verifier"]

[patch.crates-io]
rustls-platform-verifier = { path = "vendor/rustls-platform-verifier" }

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/useful-machinery/um"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"
warnings = "deny"

[workspace.lints.clippy]
# `forbid` conflicts with group-level allows emitted by Clap derives.
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
disallowed_methods = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.3", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
fs4 = "1.1.0"
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
http-body = "1.1.0"
http-body-util = "0.1.4"
hyper = { version = "1.8.1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "ring", "rustls-platform-verifier", "tls12"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
jsonschema = { version = "0.49.2", default-features = false }
libc = "0.2.189"
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
prost = "0.14"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "form", "json", "query", "rustls-no-provider"] }
regex = "1.13.1"
regress = "0.10.4"
ring = "0.17.14"
rustix = { version = "1.1.4", features = ["fs", "net", "process", "termios"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "=0.7.0"
um-api = { path = "crates/api" }
um-execution = { path = "crates/execution" }
um-human-auth = { path = "crates/human-auth" }
um-runner = { path = "crates/runner" }
um-runner-protocol = { path = "crates/runner-protocol" }
um-support = { path = "crates/support" }
um-test-support = { path = "crates/test-support" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "unbounded_depth"] }
tempfile = "3.27.0"
time = { version = "0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
trycmd = "1.2.1"
ulid = "3.0.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
yaml-rust2 = { version = "0.11.0", default-features = false }
zeroize = "1.9.0"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
flate2.workspace = true
jsonschema.workspace = true
libc.workspace = true
nix.workspace = true
ring.workspace = true
rustix.workspace = true
um-api.workspace = true
um-execution.workspace = true
um-human-auth.workspace = true
um-runner.workspace = true
um-support.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
fs4.workspace = true
futures-util.workspace = true
rustix = { workspace = true, features = ["event", "pty"] }
um-execution = { workspace = true, features = ["test-fixtures"] }
um-runner = { workspace = true, features = ["test-fixtures"] }
um-support = { workspace = true, features = ["test-fixtures"] }
um-test-support.workspace = true
trycmd.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-tungstenite.workspace = true
