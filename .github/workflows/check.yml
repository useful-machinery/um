name: Check

env:
  DEVENV_TUI: "false"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Public source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Configure devenv cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv
      # Devenv 2.3.1 embeds the Nix readOnlyMode lifetime fix (cachix/devenv#3064)
      # and restores Cachix signing-key discovery (cachix/devenv#3176).
      - name: Install devenv
        run: nix profile add github:cachix/devenv/2418e1b43797c44de5166176622c8d8fa0149871
      - name: Check public source
        run: ./scripts/check

  check_macos:
    name: macOS compile
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rust_version=$(awk -F '"' '
            $0 == "[package]" { inside_package = 1; next }
            /^\[/ { inside_package = 0 }
            inside_package && /^rust-version = / { print $2; exit }
          ' Cargo.toml)
          if [[ ! "$rust_version" =~ ^[0-9]+[.][0-9]+([.][0-9]+)?$ ]]; then
            echo "Could not read a canonical rust-version from Cargo.toml: $rust_version" >&2
            exit 1
          fi
          rustup toolchain install "$rust_version" \
            --profile minimal \
            --target aarch64-apple-darwin
          echo "RUSTUP_TOOLCHAIN=$rust_version" >>"$GITHUB_ENV"
      - name: Check macOS compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace --all-targets --all-features \
            --target aarch64-apple-darwin

  verify_release:
    name: Verify release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - check
      - check_macos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      candidate_mirror: ${{ steps.verify.outputs.candidate_mirror }}
      complete: ${{ steps.verify.outputs.complete }}
      execute: ${{ steps.verify.outputs.execute }}
      impact: ${{ steps.verify.outputs.impact }}
      release: ${{ steps.verify.outputs.release }}
      source_revision: ${{ steps.verify.outputs.source_revision }}
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Check out current workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Fetch current main and stable tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            main:refs/remotes/origin/main
          git fetch --force --tags origin
      - name: Verify exact candidate
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/verify-release-candidate \
            --repository . \
            --workflow-commit "$GITHUB_SHA" \
            --github-repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/verified-candidate" \
            --github-output "$GITHUB_OUTPUT"
      - name: Summarize proposed release
        if: steps.verify.outputs.release == 'true'
        shell: bash
        env:
          IMPACT: ${{ steps.verify.outputs.impact }}
          TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          {
            printf "## Proposed CLI release \`%s\`\n\n" "$TAG"
            printf "Impact: \`%s\`\n\n" "$IMPACT"
            cat "$RUNNER_TEMP/verified-candidate/rendered-notes.md"
          } >>"$GITHUB_STEP_SUMMARY"

  build_release:
    name: Build ${{ matrix.target }}
    if: >-
      needs.verify_release.outputs.execute == 'true' &&
      needs.verify_release.outputs.complete == 'false'
    needs: verify_release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out allocated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify_release.outputs.candidate_mirror }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Verify candidate checkout
        shell: bash
        env:
          CANDIDATE_MIRROR: ${{ needs.verify_release.outputs.candidate_mirror }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_MIRROR"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rust_version=$(awk -F '"' '
            $0 == "[package]" { inside_package = 1; next }
            /^\[/ { inside_package = 0 }
            inside_package && /^rust-version = / { print $2; exit }
          ' Cargo.toml)
          if [[ ! "$rust_version" =~ ^[0-9]+[.][0-9]+([.][0-9]+)?$ ]]; then
            echo "Could not read a canonical rust-version from Cargo.toml: $rust_version" >&2
            exit 1
          fi
          rustup toolchain install "$rust_version" \
            --profile minimal \
            --target "${{ matrix.target }}"
          echo "RUSTUP_TOOLCHAIN=$rust_version" >>"$GITHUB_ENV"
      - name: Build release binary
        shell: bash
        env:
          UM_RELEASE_COMMIT: ${{ needs.verify_release.outputs.candidate_mirror }}
          UM_VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}"
      - name: Exercise descriptor-bound command cwd
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          UM_RELEASE_COMMIT: ${{ needs.verify_release.outputs.candidate_mirror }}
          UM_VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          set -euo pipefail
          cargo test --locked --release --target "${{ matrix.target }}" \
            command_uses_contained_cwd_literal_argv_and_isolates_parent_environment \
            -- --nocapture
      - name: Verify release identity
        shell: bash
        env:
          EXPECTED_BUILD_IDENTITY: ${{ needs.verify_release.outputs.candidate_mirror }}
          EXPECTED_VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/um"
          test "$("$binary" --version)" = "um $EXPECTED_VERSION"
          version_json=$("$binary" version --json)
          python3 - "$version_json" "$EXPECTED_VERSION" "$EXPECTED_BUILD_IDENTITY" <<'PY'
          import json
          import sys

          document = json.loads(sys.argv[1])
          expected = {
              "schemaVersion": 1,
              "command": "um",
              "version": sys.argv[2],
              "buildIdentity": sys.argv[3],
          }
          for key, value in expected.items():
              if document.get(key) != value:
                  raise SystemExit(f"unexpected {key}: {document.get(key)!r}; expected {value!r}")
          if not document.get("executablePath"):
              raise SystemExit("release binary reported an empty executablePath")
          PY
      - name: Package and verify deterministic release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          set -euo pipefail
          release_dist="$RUNNER_TEMP/scherzo-release-dist"
          test ! -e "$release_dist"
          archive=$(
            ./scripts/package-release-archive \
              --binary "target/$TARGET/release/um" \
              --output "$release_dist" \
              --target "$TARGET" \
              --version "$VERSION"
          )
          ./scripts/verify-release-package-isolated \
            --archive "$archive" \
            --target "$TARGET" \
            --version "$VERSION"
          mkdir -p dist
          cp "$archive" dist/
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  reconcile_release:
    name: Publish ${{ needs.verify_release.outputs.tag }}
    if: >-
      needs.verify_release.outputs.execute == 'true' &&
      needs.verify_release.outputs.complete == 'false'
    needs:
      - verify_release
      - build_release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cli-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out current workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Fetch current main and stable tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            main:refs/remotes/origin/main
          git fetch --force --tags origin
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create exact checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path("dist")
          archives = sorted(root.glob("*.tar.gz"), key=lambda path: os.fsencode(path.name))
          if len(archives) != 3:
              raise SystemExit(f"expected three native archives, found {len(archives)}")
          lines = []
          for archive in archives:
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              lines.append(f"{digest}  {archive.name}\n")
          (root / "SHA256SUMS").write_text("".join(lines), encoding="ascii")
          PY
      - name: Inspect exact candidate release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/reconcile-release inspect \
            --repository . \
            --workflow-commit "$GITHUB_SHA" \
            --github-repository "$GITHUB_REPOSITORY" \
            --dist dist
      - name: Attest exact release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Reconcile exact GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/reconcile-release apply \
            --repository . \
            --workflow-commit "$GITHUB_SHA" \
            --github-repository "$GITHUB_REPOSITORY" \
            --dist dist
